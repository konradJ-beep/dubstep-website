<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noopis Drums</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Noopis logo" class="logo">

        <nav>
            <a href="#">HOME</a>
        </nav>
    </header>

    <main class="products">

        <div class="product-card">
            <img src="images/primal.png" alt="Primal Drums">

            <div class="product-info">
                <h2>PRIMAL DRUMS</h2>
                <p>A pack full of ruthless primal drums</p>
            </div>
        </div>


        <div class="product-card">
            <img src="images/grizzly.png" alt="Grizzly Tearout Samples">

            <div class="product-info">
                <h2>GRIZZLY TEAROUT SAMPLES</h2>
                <p>
                    Grizzly inspired samples with heavy drums
                    and powerful sounds.
                </p>
            </div>
        </div>


        <div class="product-card">
            <img src="images/rave.png" alt="Rave Serum 2">

            <div class="product-info">
                <h2>RAVE (SERUM2)</h2>
                <p>
                    A Serum 2 preset pack with high quality
                    presets for extreme sounds.
                </p>
            </div>
        </div>

    </main>

</body>
</html>
